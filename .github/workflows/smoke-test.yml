name: Smoke Test Makalah Generator

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run cek_referensi smoke test
        run: python penyusun-makalah/scripts/cek_referensi.py --smoke-test

      - name: Run buat_makalah smoke test
        run: python penyusun-makalah/scripts/buat_makalah.py --smoke-test
